[project]
name = "recall-impact-investigator"
version = "0.1.0"
description = "Evidence-backed, resumable local CPSC inventory review"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-beautifulsoup4", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/recall"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real browser integration"]
